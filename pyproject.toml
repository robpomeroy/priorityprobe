[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prioritysuite"
version = "0.1.0"
description = "Personal priorities and decision-making framework suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "gunicorn>=21.0,<28.0",
    "cryptography>=42.0,<51.0",
    "litellm>=1.30.0,<2.0",
    "openai>=1.50.0,<4.0",
    "httpx>=0.27.0,<1.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-django>=4.8,<5.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.17.0,<1.0",
    "mypy>=2.4.0,<3.0",
    "bandit>=1.9.0,<2.0",
]
prod = [
    "mysqlclient>=2.3.0,<3.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
norecursedirs = [".venv", "venv", ".git", "ansible"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-p no:cacheprovider"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py312"
line-length = 99
exclude = [
    ".git",
    ".venv",
    "venv",
    "ansible",
    "*/migrations/*",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "BLE", "RUF"]
ignore = [
    "RUF012",  # Mutable class attributes (standard pattern in Django Model / ModelForm Meta)
]

[tool.bandit]
exclude_dirs = [".venv", "venv", "tests", "ansible"]
skips = ["B101"]

[tool.coverage.run]
source = ["."]
data_file = ".coverage"
omit = [
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
    ".venv/*",
    "tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
