version: '3.8'

services:
  db:
    image: mariadb:11.4
    restart: always
    environment:
      MYSQL_DATABASE: prioritysuite
      MYSQL_USER: prioritysuite
      MYSQL_PASSWORD: prioritysuite_secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - prioritysuite_net

  web:
    build: .
    restart: always
    environment:
      DJANGO_SECRET_KEY: change-this-in-production-random-secure-string
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_ENGINE: mysql
      DB_NAME: prioritysuite
      DB_USER: prioritysuite
      DB_PASSWORD: prioritysuite_secret_password
      DB_HOST: db
      DB_PORT: 3306
      ENCRYPTION_KEY: ""
    depends_on:
      - db
    expose:
      - "8000"
    networks:
      - prioritysuite_net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    networks:
      - prioritysuite_net

volumes:
  mariadb_data:
  static_volume:

networks:
  prioritysuite_net:
