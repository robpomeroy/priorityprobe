version: '3.8'

services:
  db:
    image: mariadb:11.4
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-prioritysuite}
      MYSQL_USER: ${DB_USER:-prioritysuite}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - prioritysuite_net

  web:
    build: .
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set in .env}
      DATABASE_ENGINE: mysql
      DB_NAME: ${DB_NAME:-prioritysuite}
      DB_USER: ${DB_USER:-prioritysuite}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_HOST: db
      DB_PORT: 3306
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    depends_on:
      - db
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - prioritysuite_net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    networks:
      - prioritysuite_net

volumes:
  mariadb_data:
  static_volume:

networks:
  prioritysuite_net:
