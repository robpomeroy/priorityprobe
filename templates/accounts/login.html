{% extends 'base.html' %}
{% block title %}Log In — PrioritySuite{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border">
            <div class="card-body p-4">
                <h4 class="card-title text-terracotta mb-3">Sign In</h4>
                <p class="text-muted small">Access your private framework and decision assessments.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary bg-terracotta w-100">Sign In</button>
                </form>
                <div class="mt-4 text-center small text-muted">
                    Don't have an account? <a href="{% url 'accounts:register' %}" class="text-terracotta">Create one</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
