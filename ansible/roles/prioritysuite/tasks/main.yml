---
- name: Validate that deployment credentials and secrets are not default placeholders
  ansible.builtin.assert:
    that:
      - django_secret_key != "generate-a-secure-random-50-character-secret-key-here"
      - db_password != "change_this_to_a_secure_database_password"
      - django_secret_key | length >= 32
    fail_msg: "Production deployment rejected: django_secret_key and db_password must be changed from the example placeholder values."

- name: Ensure application root directory exists with proper ownership
  ansible.builtin.file:
    path: "{{ app_root }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Clone PrioritySuite repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_root }}"
    version: "{{ app_version }}"
    force: true
  become_user: "{{ app_user }}"

- name: Check existing virtual environment Python version
  ansible.builtin.command:
    cmd: "{{ app_root }}/.venv/bin/python -c 'import sys; print(sys.version_info[:2])'"
  register: current_venv_py
  failed_when: false
  changed_when: false
  become_user: "{{ app_user }}"

- name: Check target Python version
  ansible.builtin.command:
    cmd: "{{ python_executable | default('/usr/bin/python3.12') }} -c 'import sys; print(sys.version_info[:2])'"
  register: target_py
  changed_when: false

- name: Check for existing virtual environment backup
  ansible.builtin.stat:
    path: "{{ app_root }}/.venv_backup"
  register: venv_backup_stat
  become_user: "{{ app_user }}"
  when: current_venv_py.rc == 0 and current_venv_py.stdout != target_py.stdout

- name: Reject upgrade if previous virtual environment backup already exists
  ansible.builtin.fail:
    msg: "{{ app_root }}/.venv_backup already exists from an interrupted upgrade. Resolve or remove it before proceeding."
  when:
    - current_venv_py.rc == 0
    - current_venv_py.stdout != target_py.stdout
    - venv_backup_stat.stat.exists

- name: Back up existing virtual environment before upgrade
  ansible.builtin.command:
    cmd: "mv -T {{ app_root }}/.venv {{ app_root }}/.venv_backup"
  become_user: "{{ app_user }}"
  register: venv_backed_up
  when:
    - current_venv_py.rc == 0
    - current_venv_py.stdout != target_py.stdout
    - not venv_backup_stat.stat.exists

- name: Build replacement virtual environment and install requirements
  when:
    - current_venv_py.rc == 0
    - current_venv_py.stdout != target_py.stdout
    - venv_backed_up is defined
    - venv_backed_up is succeeded
  block:
    - name: Create upgraded virtual environment and install requirements
      ansible.builtin.pip:
        requirements: "{{ app_root }}/requirements.txt"
        virtualenv: "{{ app_root }}/.venv"
        virtualenv_command: "{{ python_executable | default('/usr/bin/python3.12') }} -m venv"
      become_user: "{{ app_user }}"

    - name: Install database driver package in upgraded virtual environment
      ansible.builtin.pip:
        name:
          - mysqlclient
        virtualenv: "{{ app_root }}/.venv"
      become_user: "{{ app_user }}"

  rescue:
    - name: Clean up failed virtual environment
      ansible.builtin.file:
        path: "{{ app_root }}/.venv"
        state: absent

    - name: Restore previous virtual environment after upgrade failure
      ansible.builtin.command:
        cmd: "mv -T {{ app_root }}/.venv_backup {{ app_root }}/.venv"
      become_user: "{{ app_user }}"

    - name: Fail task to signal upgrade failure
      ansible.builtin.fail:
        msg: "Virtual environment upgrade failed. Restored previous .venv."

- name: Remove virtual environment backup after successful upgrade
  ansible.builtin.file:
    path: "{{ app_root }}/.venv_backup"
    state: absent
  become_user: "{{ app_user }}"
  notify: Restart PrioritySuite
  when:
    - current_venv_py.rc == 0
    - current_venv_py.stdout != target_py.stdout
    - venv_backed_up is defined
    - venv_backed_up is succeeded

- name: Create Python virtual environment and install requirements
  ansible.builtin.pip:
    requirements: "{{ app_root }}/requirements.txt"
    virtualenv: "{{ app_root }}/.venv"
    virtualenv_command: "{{ python_executable | default('/usr/bin/python3.12') }} -m venv"
  become_user: "{{ app_user }}"
  when: current_venv_py.rc != 0 or current_venv_py.stdout == target_py.stdout

- name: Install database driver package
  ansible.builtin.pip:
    name:
      - mysqlclient
    virtualenv: "{{ app_root }}/.venv"
  become_user: "{{ app_user }}"
  when: current_venv_py.rc != 0 or current_venv_py.stdout == target_py.stdout

- name: Deploy .env configuration file
  ansible.builtin.template:
    src: prioritysuite.env.j2
    dest: "{{ app_root }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  notify: Restart PrioritySuite

- name: Run Django database migrations
  ansible.builtin.command:
    cmd: "{{ app_root }}/.venv/bin/python manage.py migrate --no-input"
    chdir: "{{ app_root }}"
  become_user: "{{ app_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "config.settings"

- name: Collect static files
  ansible.builtin.command:
    cmd: "{{ app_root }}/.venv/bin/python manage.py collectstatic --no-input"
    chdir: "{{ app_root }}"
  become_user: "{{ app_user }}"
  environment:
    DJANGO_SETTINGS_MODULE: "config.settings"

- name: Deploy systemd service unit for Gunicorn
  ansible.builtin.template:
    src: prioritysuite.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart PrioritySuite

- name: Enable and start PrioritySuite service
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    state: started
    enabled: true
    daemon_reload: true
