---
- name: Bootstrap EPEL on Oracle Linux 9
  ansible.builtin.dnf:
    name: oracle-epel-release-el9
    state: present
  when: ansible_distribution == "OracleLinux" and ansible_distribution_major_version == "9"

- name: Bootstrap EPEL on non-Oracle Linux distributions
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_distribution != "OracleLinux"

- name: Install essential system build packages on Oracle Linux / RHEL
  ansible.builtin.dnf:
    name:
      - git
      - python3.11
      - python3.11-pip
      - python3.11-devel
      - gcc
      - mariadb-devel
      - firewalld
      - policycoreutils-python-utils
      - setroubleshoot-server
    state: present
    update_cache: true

- name: Ensure firewalld service is running and enabled
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Allow SSH, HTTP, and HTTPS through firewalld
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - ssh
    - http
    - https

- name: Create dedicated application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present

- name: Create dedicated application system user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "{{ app_root }}"
    shell: /sbin/nologin
    create_home: false
    state: present
