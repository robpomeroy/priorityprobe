---
- name: Install MariaDB server packages
  ansible.builtin.dnf:
    name:
      - mariadb-server
      - python3-PyMySQL
    state: present

- name: Configure MariaDB loopback binding
  ansible.builtin.copy:
    dest: /etc/my.cnf.d/prioritysuite.cnf
    content: |
      [mariadb]
      bind-address = 127.0.0.1
    owner: root
    group: root
    mode: "0644"
  notify: Restart MariaDB

- name: Enable and start MariaDB service
  ansible.builtin.systemd:
    name: mariadb
    state: started
    enabled: true

- name: Remove MariaDB anonymous users
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_user: root
    login_unix_socket: /var/lib/mysql/mysql.sock

- name: Remove MariaDB test database
  community.mysql.mysql_db:
    name: test
    state: absent
    login_user: root
    login_unix_socket: /var/lib/mysql/mysql.sock

- name: Create PrioritySuite application database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_user: root
    login_unix_socket: /var/lib/mysql/mysql.sock
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci

- name: Create PrioritySuite database user with full schema privileges
  no_log: true
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: "{{ item }}"
    state: present
    login_user: root
    login_unix_socket: /var/lib/mysql/mysql.sock
  loop:
    - "127.0.0.1"
    - "localhost"
